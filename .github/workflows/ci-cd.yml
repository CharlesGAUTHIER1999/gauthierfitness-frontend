# ════════════════════════════════════════════════════════════════════
#  GauthierFitness Frontend — CI
#  repo : CharlesGAUTHIER1999/gauthierfitness-frontend
#
#  Séquence : ESLint → Build → Build image GHCR → Trigger deploy infra
# ════════════════════════════════════════════════════════════════════

name: CI Frontend

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/charlesgauthier1999/gauthierfitness-frontend

# ──────────────────────────────────────────────────────────────────
# JOB 1 — Lint + Build Vite
# ──────────────────────────────────────────────────────────────────
jobs:
  lint-build:
    name: "🔍 ESLint + Build Vite"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install deps
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Build Vite (vérification compilation)
        run: npm run build
        env:
          VITE_API_URL: "http://localhost/api"
          VITE_STRIPE_PUBLIC_KEY: "pk_test_dummy"

# ──────────────────────────────────────────────────────────────────
# JOB 2 — Build & Push image GHCR (push uniquement, pas PR)
# ──────────────────────────────────────────────────────────────────
  build:
    name: "🐳 Build image frontend"
    runs-on: ubuntu-latest
    needs: lint-build
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_API_URL=/api
            VITE_STRIPE_PUBLIC_KEY=${{ github.ref == 'refs/heads/main' && secrets.VITE_STRIPE_PUBLIC_KEY_LIVE || secrets.VITE_STRIPE_PUBLIC_KEY_TEST }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# ──────────────────────────────────────────────────────────────────
# JOB 3 — Déclencher le deploy dans gauthierfitness-infra
# ──────────────────────────────────────────────────────────────────
  trigger-deploy:
    name: "📡 Trigger deploy infra"
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'

    steps:
      - name: Dispatch vers gauthierfitness-infra
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          repository: CharlesGAUTHIER1999/gauthierfitness-infra
          event-type: deploy-staging
          client-payload: |
            {
              "image_tag": "${{ needs.build.outputs.image_tag }}",
              "service": "frontend",
              "branch": "${{ github.ref_name }}"
            }
